<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" shape-rendering="geometricPrecision" color-interpolation="sRGB">
  <title>LocalKeep app icon</title>
  <!--
    Icon Lab option 1a, "Slim & sharp", at hero scale. The drawing of record is assets/icon-slim.svg
    (512 grid); this is that file mapped onto the hero canvas, and logo-compact.svg is that file
    verbatim. The app ships the same mark — app/src/main/res/drawable/ic_launcher_foreground.xml.

    Two mappings, because the tile and the shield are not the same scale here. Tile chrome (ground,
    frame, hairline) maps through the tile: 9..503 -> 20..1004, factor 1.9919. Everything living on
    the shield maps through the shield's own bounding box, x92..420/y84..462 -> x192..832/y176..918,
    factors 1.9512 and 1.9630 — the hero shield is a hair narrower against its canvas than the
    compact one, and mapping through the canvas would have drifted the light off the silhouette.
    The keyhole group keeps its own base units (base radius 56 -> 105, factor 1.875).

    Silhouette and keyhole are untouched: 1a changed lighting only, so this is the same shield the
    file has always drawn, re-lit. What changed is 1a's five surface moves — brighter plate, the soft
    radial haze replaced by an angular lit facet, a harder crown, a brighter rim, and a crisper
    keyhole with a specular arc on the far wall — plus the slimmer frame the option is named for.
  -->
  <defs>
    <radialGradient id="ground" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(292.9 213.2) rotate(43) scale(1035.8)">
      <stop stop-color="#1E3E36"></stop>
      <stop offset=".5" stop-color="#0D1A19"></stop>
      <stop offset="1" stop-color="#060909"></stop>
    </radialGradient>
    <linearGradient id="frame" x1="141.5" y1="89.7" x2="888.5" y2="934.3" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6BF0CB" stop-opacity=".85"></stop>
      <stop offset=".52" stop-color="#2BC79F" stop-opacity=".38"></stop>
      <stop offset="1" stop-color="#12765F" stop-opacity=".55"></stop>
    </linearGradient>
    <linearGradient id="plate" x1="266.1" y1="215.3" x2="754" y2="902.3" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83F8D6"></stop>
      <stop offset=".46" stop-color="#31D0A5"></stop>
      <stop offset="1" stop-color="#0E8A6B"></stop>
    </linearGradient>
    <linearGradient id="rim" x1="512" y1="176" x2="512" y2="658.9" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2FFFB" stop-opacity=".9"></stop>
      <stop offset=".5" stop-color="#AEFFE9" stop-opacity=".2"></stop>
      <stop offset="1" stop-color="#58E4BD" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="facet" x1="305.2" y1="187.8" x2="656.4" y2="521.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".22"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="shade" x1="512" y1="439" x2="512" y2="929.8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00150F" stop-opacity="0"></stop>
      <stop offset="1" stop-color="#00150F" stop-opacity=".3"></stop>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M512 176 806 306q26 12 26 40v180c0 198-126 340-302 388q-18 5-36 0C318 866 192 724 192 526V346q0-28 26-40L512 176Z"></path>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="984" height="984" rx="255" fill="url(#ground)"></rect>
  <rect x="26" y="26" width="972" height="972" rx="249" stroke="url(#frame)" stroke-width="12"></rect>
  <rect x="44" y="44" width="936" height="936" rx="233" stroke="white" stroke-opacity=".09" stroke-width="4"></rect>

  <path d="M512 176 806 306q26 12 26 40v180c0 198-126 340-302 388q-18 5-36 0C318 866 192 724 192 526V346q0-28 26-40L512 176Z" fill="url(#plate)"></path>
  <g clip-path="url(#shieldClip)">
    <path d="M512 176 219.3 305.6 277.9 717.8Z" fill="url(#facet)"></path>
    <path d="M231 342.9 512 219.2l281 123.7" stroke="white" stroke-opacity=".4" stroke-width="13.7" stroke-linecap="round" stroke-linejoin="round"></path>
    <rect x="160" y="144" width="704" height="792" fill="url(#shade)"></rect>
  </g>
  <path d="M512 176 806 306q26 12 26 40v180c0 198-126 340-302 388q-18 5-36 0C318 866 192 724 192 526V346q0-28 26-40L512 176Z" stroke="url(#rim)" stroke-width="13.7" stroke-linejoin="round"></path>

  <g transform="translate(92.67 96.84) scale(0.819)">
    <path d="M512 430c-58 0-105 47-105 105 0 42 25 80 64 97v112c0 23 18 41 41 41s41-18 41-41V632c39-17 64-55 64-97 0-58-47-105-105-105Z" fill="#00110C" fill-opacity=".5" transform="translate(-5.6 -7.5)"></path>
    <path d="M512 430c-58 0-105 47-105 105 0 42 25 80 64 97v112c0 23 18 41 41 41s41-18 41-41V632c39-17 64-55 64-97 0-58-47-105-105-105Z" fill="#96FBE1" transform="translate(7.5 9.4)"></path>
    <path d="M512 430c-58 0-105 47-105 105 0 42 25 80 64 97v112c0 23 18 41 41 41s41-18 41-41V632c39-17 64-55 64-97 0-58-47-105-105-105Z" fill="#03170F"></path>
    <path d="M423.9 508.8a97.5 97.5 0 0 1 138.8-50.6" stroke="#B9FFE9" stroke-opacity=".5" stroke-width="13.1" stroke-linecap="round"></path>
  </g>
</svg>
