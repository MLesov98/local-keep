<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>LocalKeep autofill test</title>
  </head>
  <body>
    <h1>Web login</h1>
    <form>
      <p><label>Username <input id="username" autocomplete="username" autofocus></label></p>
      <p><label>Password <input id="password" type="password" autocomplete="current-password"></label></p>
      <button type="submit">Sign in</button>
    </form>

    <!--
      Checkout, for the card path. This page had login fields only, which is why nothing ever
      noticed that a card could be captured here and never offered back: the save side was
      exercised by hand and the fill side had no form to appear on.

      The `autocomplete` tokens are the WHATWG `cc-*` names FieldDetector matches on, so this
      exercises the real detection rather than a label heuristic. Expect one authenticated row per
      stored card — masked, never showing the number — and the values to arrive only after the
      challenge is answered.
    -->
    <h1>Checkout</h1>
    <form>
      <p><label>Name on card <input id="cc-name" autocomplete="cc-name"></label></p>
      <p><label>Card number <input id="cc-number" autocomplete="cc-number" inputmode="numeric"></label></p>
      <p><label>Expiry <input id="cc-exp" autocomplete="cc-exp" placeholder="MM/YY"></label></p>
      <p><label>Security code <input id="cc-csc" autocomplete="cc-csc" inputmode="numeric"></label></p>
      <button type="submit">Pay</button>
    </form>
  </body>
</html>
